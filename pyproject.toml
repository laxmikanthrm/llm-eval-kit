[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-kit"
version = "0.1.0"
description = "Lightweight, offline evaluation for LLM outputs: groundedness, relevance, refusals, and format checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llm-eval = "llm_eval.__main__:main"

[tool.setuptools]
packages = ["llm_eval"]
